[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xos"
version = "1.0.0"
description = "XOS — AI-Native Experience Engineering Operating System for React Native + Expo"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.20",
    "pyyaml>=6.0",
    "pydantic>=2.5",
]

[project.scripts]
xos = "python.cli:main"

[tool.setuptools.packages.find]
include = ["python*"]
